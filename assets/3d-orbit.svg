<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="core" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#c0caf5"/><stop offset="0.45" stop-color="#7aa2f7"/><stop offset="1" stop-color="#1a1b26"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.45"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/><stop offset="0.5" stop-color="#bb9af7" stop-opacity="0.8"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <path id="orbit" d="M570,130 A220,55 0 1 1 130,130 A220,55 0 1 1 570,130"/>
    <path id="orbit2" d="M520,130 A170,32 0 1 1 180,130 A170,32 0 1 1 520,130"/>
  </defs>
  <rect width="700" height="260" fill="#0d1117" rx="14"/>

  <!-- orbit rings (tilted ellipses = fake 3D) -->
  <ellipse cx="350" cy="130" rx="220" ry="55" fill="none" stroke="url(#ring)" stroke-width="1.5"/>
  <ellipse cx="350" cy="130" rx="170" ry="32" fill="none" stroke="url(#ring)" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- core sphere -->
  <circle cx="350" cy="130" r="70" fill="url(#glow)">
    <animate attributeName="r" values="62;74;62" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="130" r="34" fill="url(#core)"/>
  <text x="350" y="135" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" font-weight="700" fill="#0d1117">AG</text>

  <!-- Outer orbit planets. Path starts on the right and goes through the FRONT (bottom) first,
       so the first half is big/bright and the second half (back) is small/dim -->
  <g id="p1">
    <animateMotion dur="14s" repeatCount="indefinite" begin="0s"><mpath href="#orbit"/></animateMotion>
    <circle r="12" fill="#7aa2f7"><animate attributeName="r" values="10;15;10;6;10" keyTimes="0;0.25;0.5;0.75;1" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;1;0.9;0.4;0.9" keyTimes="0;0.25;0.5;0.75;1" dur="14s" repeatCount="indefinite"/></circle>
    <text y="-20" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#c0caf5">Python</text>
  </g>
  <g id="p2">
    <animateMotion dur="14s" repeatCount="indefinite" begin="-3.5s"><mpath href="#orbit"/></animateMotion>
    <circle r="12" fill="#bb9af7"><animate attributeName="r" values="10;15;10;6;10" keyTimes="0;0.25;0.5;0.75;1" dur="14s" begin="-3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;1;0.9;0.4;0.9" keyTimes="0;0.25;0.5;0.75;1" dur="14s" begin="-3.5s" repeatCount="indefinite"/></circle>
    <text y="-20" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#c0caf5">React</text>
  </g>
  <g id="p3">
    <animateMotion dur="14s" repeatCount="indefinite" begin="-7s"><mpath href="#orbit"/></animateMotion>
    <circle r="12" fill="#9ece6a"><animate attributeName="r" values="10;15;10;6;10" keyTimes="0;0.25;0.5;0.75;1" dur="14s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;1;0.9;0.4;0.9" keyTimes="0;0.25;0.5;0.75;1" dur="14s" begin="-7s" repeatCount="indefinite"/></circle>
    <text y="-20" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#c0caf5">Node.js</text>
  </g>
  <g id="p4">
    <animateMotion dur="14s" repeatCount="indefinite" begin="-10.5s"><mpath href="#orbit"/></animateMotion>
    <circle r="12" fill="#e0af68"><animate attributeName="r" values="10;15;10;6;10" keyTimes="0;0.25;0.5;0.75;1" dur="14s" begin="-10.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;1;0.9;0.4;0.9" keyTimes="0;0.25;0.5;0.75;1" dur="14s" begin="-10.5s" repeatCount="indefinite"/></circle>
    <text y="-20" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#c0caf5">Java</text>
  </g>

  <!-- Inner orbit, opposite direction feel via faster speed -->
  <g id="q1">
    <animateMotion dur="8s" repeatCount="indefinite" begin="0s"><mpath href="#orbit2"/></animateMotion>
    <circle r="8" fill="#f7768e"><animate attributeName="r" values="7;10;7;4;7" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;1;0.9;0.4;0.9" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/></circle>
    <text y="-14" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#c0caf5">PyTorch</text>
  </g>
  <g id="q2">
    <animateMotion dur="8s" repeatCount="indefinite" begin="-4s"><mpath href="#orbit2"/></animateMotion>
    <circle r="8" fill="#7dcfff"><animate attributeName="r" values="7;10;7;4;7" keyTimes="0;0.25;0.5;0.75;1" dur="8s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;1;0.9;0.4;0.9" keyTimes="0;0.25;0.5;0.75;1" dur="8s" begin="-4s" repeatCount="indefinite"/></circle>
    <text y="-14" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#c0caf5">FastAPI</text>
  </g>

  <!-- twinkling stars -->
  <g fill="#c0caf5">
    <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="60" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="215" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="220" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="28" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
